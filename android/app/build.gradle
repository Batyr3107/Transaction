plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.kaspi.analyzer"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.kaspi.analyzer"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"

        // Enable multidex for better compatibility
        multiDexEnabled true
    }

    buildTypes {
        debug {
            // Debug configuration
            minifyEnabled false
            shrinkResources false
            debuggable true
        }

        release {
            // Enable code shrinking, obfuscation, and optimization
            minifyEnabled true
            shrinkResources true
            debuggable false

            // ProGuard files
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // For now use debug signing (replace with release signing for production)
            signingConfig = signingConfigs.debug

            // Native symbols for crash reporting
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    // Build optimization
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Multidex support for older Android versions
    implementation 'androidx.multidex:multidex:2.0.1'
}
